<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reps">
<meta name="theme-color" content="#14161a">
<title>Reps — training log</title>
<style>
  :root{
    --floor:#14161a;        /* rubber gym floor */
    --floor-2:#1d2026;
    --paper:#F0EDE4;        /* log page */
    --paper-rule:#D6D1C2;
    --ink:#15161a;
    --ink-soft:#6d6a60;
    --bone:#F2F1EE;
    --steel:#8b9099;
    --plate-blue:#2D7DD2;   /* 20kg */
    --plate-red:#CE2B2B;    /* 25kg */
    --plate-yellow:#E0A500; /* 15kg */
    --radius:14px;
    --pad:16px;
    --cond:"Avenir Next Condensed","Helvetica Neue Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--floor);
    color:var(--bone);
    font-family:var(--body);
    font-size:16px;
    -webkit-text-size-adjust:100%;
    overscroll-behavior-y:none;
    padding-bottom:calc(76px + env(safe-area-inset-bottom));
  }
  button,input,select{font:inherit;color:inherit}
  button{background:none;border:0;cursor:pointer}
  .hide{display:none !important}

  /* ---------- top chrome ---------- */
  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(var(--floor) 78%,rgba(20,22,26,0));
    padding:calc(env(safe-area-inset-top) + 14px) var(--pad) 12px;
  }
  .daybar{display:flex;align-items:center;gap:12px}
  .daybar h1{
    font-family:var(--cond);font-weight:700;font-size:30px;letter-spacing:.045em;
    text-transform:uppercase;margin:0;flex:1;line-height:1
  }
  .nav-btn{
    width:38px;height:38px;border-radius:10px;background:var(--floor-2);
    color:var(--steel);font-size:19px;line-height:1;display:grid;place-items:center;
  }
  .nav-btn:active{background:#272b33}
  .daystat{
    margin-top:6px;font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--steel);
  }
  .daystat b{color:var(--bone);font-weight:600}

  /* ---------- log sheet ---------- */
  main{padding:0 var(--pad)}
  .sheet{
    background:var(--paper);color:var(--ink);border-radius:var(--radius);
    margin-bottom:12px;overflow:hidden;
    box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 8px 20px rgba(0,0,0,.35);
  }
  .sheet-head{
    display:flex;align-items:baseline;gap:8px;
    padding:13px 14px 9px;border-bottom:1.5px solid var(--ink);
  }
  .sheet-head h2{
    margin:0;flex:1;font-family:var(--cond);font-weight:700;font-size:21px;
    letter-spacing:.03em;text-transform:uppercase;line-height:1.05
  }
  .sheet-head .vol{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
  .kebab{padding:0 4px;color:var(--ink-soft);font-size:20px;line-height:.6}
  .tbadge{
    font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
    padding:2px 6px;border-radius:4px;border:1px solid currentColor;line-height:1.4;flex:none
  }

  .setrow{
    display:flex;align-items:center;gap:10px;padding:7px 14px;
    border-bottom:1px solid var(--paper-rule);
  }
  .setrow:last-child{border-bottom:0}
  .idx{
    font-family:var(--mono);font-size:11px;color:var(--ink-soft);
    width:16px;flex:none;padding-top:3px
  }
  .figure{font-family:var(--cond);font-weight:600;font-size:24px;letter-spacing:.01em;line-height:1.1;flex:1}
  .figure .x{color:var(--ink-soft);font-weight:400;padding:0 2px}
  .figure .unit{font-size:13px;color:var(--ink-soft);font-weight:500;padding-left:3px}
  .setvol{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
  .tag{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    padding:2px 5px;border-radius:4px;color:#fff;background:var(--plate-red);
  }
  .delta{font-family:var(--mono);font-size:10px;color:var(--plate-blue);letter-spacing:.02em}
  .delta.down{color:var(--ink-soft)}

  .lastline{
    padding:8px 14px 11px;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.05em;color:var(--ink-soft);
    border-top:1.5px solid var(--ink);background:rgba(0,0,0,.03)
  }

  /* ---------- buttons ---------- */
  .add{
    width:100%;padding:15px;border:1.5px dashed #3a3f48;border-radius:var(--radius);
    color:var(--steel);font-family:var(--cond);font-size:17px;font-weight:600;
    letter-spacing:.09em;text-transform:uppercase;margin-bottom:14px
  }
  .add:active{border-color:var(--plate-blue);color:var(--bone)}
  .primary{
    background:var(--plate-blue);color:#fff;border-radius:12px;padding:15px;
    font-family:var(--cond);font-size:18px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;width:100%
  }
  .primary:disabled{opacity:.35}
  .ghostbtn{
    background:var(--floor-2);color:var(--steel);border-radius:10px;padding:11px 14px;
    font-size:13px;font-weight:600
  }

  .empty{
    text-align:center;color:var(--steel);padding:44px 20px;
  }
  .empty .big{font-family:var(--cond);font-size:22px;letter-spacing:.05em;text-transform:uppercase;color:#4a505a}
  .empty p{font-size:13.5px;margin:8px 0 0;line-height:1.5}

  /* ---------- bottom tabs ---------- */
  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
    background:rgba(20,22,26,.93);backdrop-filter:blur(14px);
    border-top:1px solid #262a31;padding-bottom:env(safe-area-inset-bottom)
  }
  nav.tabs button{
    flex:1;padding:12px 0 13px;font-family:var(--cond);font-size:13px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:#5b616b
  }
  nav.tabs button[aria-selected="true"]{color:var(--bone);box-shadow:inset 0 2px 0 var(--plate-blue)}

  /* ---------- entry sheet ---------- */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
  .panel{
    position:fixed;left:0;right:0;bottom:0;top:0;z-index:41;background:var(--floor);
    display:flex;flex-direction:column;
  }
  .panel-head{
    display:flex;align-items:center;gap:12px;
    padding:calc(env(safe-area-inset-top) + 12px) var(--pad) 12px;border-bottom:1px solid #262a31
  }
  .panel-head .t{
    flex:1;font-family:var(--cond);font-size:19px;font-weight:700;letter-spacing:.08em;text-transform:uppercase
  }
  .panel-body{flex:1;overflow-y:auto;padding:var(--pad);-webkit-overflow-scrolling:touch}
  .panel-foot{padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom));border-top:1px solid #262a31}

  label.fl{
    display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--steel);margin:0 0 7px
  }
  input[type=text],input[type=date]{
    width:100%;background:var(--floor-2);border:1px solid #2d323a;border-radius:11px;
    padding:13px 14px;font-size:16px
  }
  input:focus-visible,button:focus-visible{outline:2px solid var(--plate-blue);outline-offset:2px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .chip{
    background:var(--floor-2);border:1px solid #2d323a;border-radius:999px;
    padding:7px 12px;font-size:13px;color:var(--steel)
  }
  .chip:active{border-color:var(--plate-blue);color:var(--bone)}

  .ghostlast{
    margin:16px 0 4px;padding:11px 13px;border-left:2px solid var(--plate-yellow);
    background:rgba(224,165,0,.07);border-radius:0 10px 10px 0
  }
  .ghostlast .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--plate-yellow)}
  .ghostlast .val{font-family:var(--cond);font-size:19px;letter-spacing:.02em;margin-top:3px;color:#cfcabc}

  .steppers{display:flex;gap:10px;margin:18px 0 4px}
  .stepper{flex:1;background:var(--floor-2);border-radius:14px;padding:11px 10px 13px;text-align:center}
  .stepper .cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}
  .stepper .row{display:flex;align-items:center;gap:6px;margin-top:5px}
  .stepper .pm{
    width:40px;height:40px;border-radius:10px;background:#282d35;color:var(--bone);
    font-size:21px;line-height:1;display:grid;place-items:center;flex:none
  }
  .stepper .pm:active{background:var(--plate-blue)}
  .stepper input{
    flex:1;width:100%;min-width:0;background:none;border:0;text-align:center;
    font-family:var(--cond);font-weight:700;font-size:33px;letter-spacing:.01em;padding:0
  }

  .queued{margin-top:20px}
  .queued .qhead{
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);
    padding-bottom:8px;border-bottom:1px solid #262a31
  }
  .qrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid #1f2329}
  .qrow .figure{color:var(--bone);font-size:22px}
  .qrow .figure .x,.qrow .figure .unit{color:var(--steel)}
  .qrow .setvol{color:var(--steel)}
  .rm{width:30px;height:30px;border-radius:8px;background:#242830;color:#787e88;font-size:17px;display:grid;place-items:center;flex:none}

  /* ---------- history ---------- */
  .search{margin-bottom:12px}
  .hrow{
    display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid #1f2329;width:100%;text-align:left
  }
  .hrow .nm{flex:1;font-family:var(--cond);font-size:19px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
  .hrow .sub{font-family:var(--mono);font-size:10.5px;color:var(--steel);margin-top:2px;letter-spacing:.04em;text-transform:none}
  .hrow .best{font-family:var(--cond);font-size:19px;font-weight:700;color:var(--plate-blue)}

  .prcards{display:flex;gap:9px;margin:4px 0 20px}
  .prcard{flex:1;background:var(--floor-2);border-radius:12px;padding:12px}
  .prcard .cap{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--steel)}
  .prcard .v{font-family:var(--cond);font-size:25px;font-weight:700;margin-top:4px;line-height:1}
  .prcard .v small{font-size:12px;color:var(--steel);font-weight:500}

  .sparkwrap{background:var(--floor-2);border-radius:12px;padding:14px 12px 10px;margin-bottom:20px}
  .sparkwrap .cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--steel);margin-bottom:10px}
  svg.spark{display:block;width:100%;height:72px;overflow:visible}

  .session{margin-bottom:10px;background:var(--floor-2);border-radius:12px;padding:12px 14px}
  .session .d{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel)}
  .session .s{font-family:var(--cond);font-size:18px;letter-spacing:.02em;margin-top:4px}

  .note{
    font-size:12.5px;line-height:1.5;color:var(--steel);background:var(--floor-2);
    border-radius:12px;padding:13px 14px;margin-bottom:14px
  }
  .note b{color:var(--plate-yellow)}
  .toolrow{display:flex;gap:9px;margin-top:12px}
  .toolrow button{flex:1}
  @media(prefers-reduced-motion:no-preference){
    .panel{animation:up .22s cubic-bezier(.32,.72,0,1)}
    @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  }
</style>
</head>
<body>

<header>
  <div class="daybar" id="daybar">
    <h1 id="dayTitle">—</h1>
    <button class="nav-btn" id="prevDay" aria-label="Previous day">‹</button>
    <button class="nav-btn" id="nextDay" aria-label="Next day">›</button>
  </div>
  <div class="daystat" id="dayStat"></div>
</header>

<main id="view"></main>

<nav class="tabs">
  <button data-tab="log" aria-selected="true">Log</button>
  <button data-tab="history" aria-selected="false">History</button>
  <button data-tab="data" aria-selected="false">Data</button>
</nav>

<div id="modal"></div>
<datalist id="exlist"></datalist>

<script>
(function(){
"use strict";

/* ---------------- storage ---------------- */
var KEY = "reps:v1";
var mem = {};
var persistent = !!(window.storage && window.storage.get);
var store = {
  get: function(k){
    if (persistent) return window.storage.get(k).then(function(r){ return r ? r.value : null; }).catch(function(){ return null; });
    return Promise.resolve(mem[k] || null);
  },
  set: function(k,v){
    if (persistent) return window.storage.set(k,v).catch(function(){ persistent=false; mem[k]=v; });
    mem[k]=v; return Promise.resolve();
  }
};

var db = { units:"lb", days:{} };
var tab = "log";
var cursor = todayKey();
var openExercise = null;   // history detail
var historyType = "all";  // history type filter

/* ---------------- date utils ---------------- */
function todayKey(){
  var d=new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function pad(n){ return n<10 ? "0"+n : ""+n; }
function shiftKey(k, delta){
  var p=k.split("-");
  var d=new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate()+delta);
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function labelDate(k){
  var p=k.split("-"), d=new Date(+p[0],+p[1]-1,+p[2]);
  if(k===todayKey()) return "Today";
  if(k===shiftKey(todayKey(),-1)) return "Yesterday";
  return DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()];
}
function shortDate(k){
  var p=k.split("-"), d=new Date(+p[0],+p[1]-1,+p[2]);
  return MON[d.getMonth()]+" "+d.getDate();
}
function daysBetween(a,b){
  var pa=a.split("-"), pb=b.split("-");
  var da=new Date(+pa[0],+pa[1]-1,+pa[2]), dbb=new Date(+pb[0],+pb[1]-1,+pb[2]);
  return Math.round((dbb-da)/86400000);
}

/* ---------------- data helpers ---------------- */
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function num(n){ return Math.round(n).toLocaleString(); }
function trim(n){ return (Math.round(n*10)/10).toString(); }

function dayEntries(k){ return db.days[k] || []; }
function dayVolume(k){
  return dayEntries(k).reduce(function(t,e){ return t+entryVolume(e); },0);
}
function entryVolume(e){
  return e.sets.reduce(function(t,s){ return t + s.reps*s.weight; },0);
}
function sortedDays(){
  return Object.keys(db.days).filter(function(k){ return db.days[k].length; }).sort();
}
function exerciseNames(){
  var seen={}, out=[];
  sortedDays().reverse().forEach(function(k){
    db.days[k].forEach(function(e){
      var key=e.name.toLowerCase();
      if(!seen[key]){ seen[key]=1; out.push(e.name); }
    });
  });
  return out;
}
var TYPES = [
  {key:"push", label:"Push"},
  {key:"pull", label:"Pull"},
  {key:"legs", label:"Legs"},
  {key:"mix", label:"Mix/Other"},
  {key:"cardio", label:"Cardio"}
];
function typeLabel(key){
  for(var i=0;i<TYPES.length;i++) if(TYPES[i].key===key) return TYPES[i].label;
  return "Mix/Other";
}
function typeColor(key){
  return { push:"#2D7DD2", pull:"#E0A500", legs:"#CE2B2B", cardio:"#2E9E8F", mix:"#8b9099" }[key] || "#8b9099";
}
function exerciseNamesByType(type){
  var seen={}, out=[];
  sortedDays().reverse().forEach(function(k){
    db.days[k].forEach(function(e){
      if((e.type||"mix")!==type) return;
      var key=e.name.toLowerCase();
      if(!seen[key]){ seen[key]=1; out.push(e.name); }
    });
  });
  return out;
}
function sessionsOf(name){
  var lc=name.toLowerCase(), out=[];
  sortedDays().forEach(function(k){
    db.days[k].forEach(function(e){
      if(e.name.toLowerCase()===lc) out.push({date:k, sets:e.sets, type:e.type||"mix"});
    });
  });
  return out;                       // ascending
}
function lastSessionBefore(name, dateKey, excludeId){
  var lc=name.toLowerCase(), best=null;
  sortedDays().forEach(function(k){
    if(k>dateKey) return;
    db.days[k].forEach(function(e){
      if(e.name.toLowerCase()!==lc) return;
      if(k===dateKey && e.id===excludeId) return;
      best={date:k, sets:e.sets, type:e.type||"mix"};
    });
  });
  return best;
}
function topSet(sets){
  return sets.reduce(function(a,s){ return (!a || s.weight>a.weight || (s.weight===a.weight && s.reps>a.reps)) ? s : a; }, null);
}
function e1rm(s){ return s.weight * (1 + s.reps/30); }
function bestEver(name, excludeDate, excludeId){
  var b=0;
  sessionsOf(name).forEach(function(s){
    if(excludeDate && s.date===excludeDate) return;
    s.sets.forEach(function(x){ if(x.weight>b) b=x.weight; });
  });
  return b;
}
function summarise(sets){
  // group identical reps×weight → "3×8 @ 135"
  var parts=[], i=0;
  while(i<sets.length){
    var j=i;
    while(j+1<sets.length && sets[j+1].reps===sets[i].reps && sets[j+1].weight===sets[i].weight) j++;
    var n=j-i+1;
    parts.push((n>1?n+"×":"")+sets[i].reps+" @ "+trim(sets[i].weight));
    i=j+1;
  }
  return parts.join(", ")+" "+db.units;
}

function save(){ return store.set(KEY, JSON.stringify(db)); }
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ---------------- render ---------------- */
var view = document.getElementById("view");
var dayTitle = document.getElementById("dayTitle");
var dayStat = document.getElementById("dayStat");
var daybar = document.getElementById("daybar");

function render(){
  var isLog = tab==="log";
  document.getElementById("prevDay").classList.toggle("hide", !isLog);
  document.getElementById("nextDay").classList.toggle("hide", !isLog);
  dayStat.classList.toggle("hide", !isLog);
  if(isLog) renderLog();
  else if(tab==="history") openExercise ? renderExercise() : renderHistory();
  else renderData();
  refreshDatalist();
}

function renderLog(){
  dayTitle.textContent = labelDate(cursor);
  var list = dayEntries(cursor);
  var sets = list.reduce(function(t,e){ return t+e.sets.length; },0);
  dayStat.innerHTML = list.length
    ? "<b>"+list.length+"</b> exercise"+(list.length>1?"s":"")+" · <b>"+sets+"</b> sets · <b>"+num(dayVolume(cursor))+"</b> "+db.units+" moved"
    : shortDate(cursor)+" · nothing logged";

  var html = "";
  list.forEach(function(e){
    var prev = lastSessionBefore(e.name, cursor, e.id);
    var pr = bestEver(e.name, cursor, e.id);
    html += '<section class="sheet" data-id="'+e.id+'">';
    html += '<div class="sheet-head"><h2>'+esc(e.name)+'</h2>'+
            '<span class="tbadge" style="color:'+typeColor(e.type||"mix")+'">'+esc(typeLabel(e.type||"mix"))+'</span>'+
            '<span class="vol">'+num(entryVolume(e))+' '+db.units+'</span>'+
            '<button class="kebab" data-edit="'+e.id+'" aria-label="Edit '+esc(e.name)+'">⋯</button></div>';
    e.sets.forEach(function(s,i){
      var isPR = pr>0 && s.weight>pr;
      html += '<div class="setrow"><span class="idx">'+(i+1)+'</span>'+
              '<span class="figure">'+s.reps+'<span class="x">×</span>'+trim(s.weight)+
              '<span class="unit">'+db.units+'</span></span>'+
              (isPR ? '<span class="tag">PR</span>' : '')+
              '<span class="setvol">'+num(s.reps*s.weight)+'</span></div>';
    });
    if(prev){
      var gap = daysBetween(prev.date, cursor);
      html += '<div class="lastline">Last time · '+shortDate(prev.date)+' ('+gap+'d ago) · '+esc(summarise(prev.sets))+'</div>';
    }
    html += '</section>';
  });

  if(!list.length){
    html = '<div class="empty"><div class="big">Empty page</div>'+
           '<p>Add your first exercise of the day. Previous numbers show up as soon as you name it.</p></div>';
  }
  html += '<button class="add" id="addBtn">+ Add exercise</button>';
  view.innerHTML = html;
}

function renderHistory(){
  var names = exerciseNames();
  var q = (window.__q||"").toLowerCase();
  var html = '<div class="chips" style="margin-bottom:12px">'+
    '<button class="chip" data-htype="all"'+(historyType==="all"?' style="border-color:var(--plate-blue);color:var(--bone)"':'')+'>All</button>'+
    TYPES.map(function(t){
      return '<button class="chip" data-htype="'+t.key+'"'+(historyType===t.key?' style="border-color:'+typeColor(t.key)+';color:var(--bone)"':'')+'>'+esc(t.label)+'</button>';
    }).join("")+
    '</div>';
  html += '<div class="search"><input type="text" id="q" placeholder="Search exercises" value="'+esc(window.__q||"")+'"></div>';
  var shown = names.filter(function(n){
    if(n.toLowerCase().indexOf(q)<0) return false;
    if(historyType==="all") return true;
    return sessionsOf(n).some(function(s){ return s.type===historyType; });
  });
  if(!names.length){
    html += '<div class="empty"><div class="big">No history yet</div><p>Log a session and it lands here, with every set kept by date.</p></div>';
  } else if(!shown.length){
    html += '<div class="empty"><div class="big">No matches</div><p>Nothing logged for this type yet.</p></div>';
  } else {
    shown.forEach(function(n){
      var ss = sessionsOf(n);
      var last = ss[ss.length-1];
      var best = 0;
      ss.forEach(function(s){ s.sets.forEach(function(x){ if(x.weight>best) best=x.weight; }); });
      html += '<button class="hrow" data-ex="'+esc(n)+'"><span class="nm">'+esc(n)+
              '<span class="tbadge" style="color:'+typeColor(last.type)+';margin-left:8px">'+esc(typeLabel(last.type))+'</span>'+
              '<div class="sub">'+ss.length+' session'+(ss.length>1?"s":"")+' · last '+shortDate(last.date)+'</div></span>'+
              '<span class="best">'+trim(best)+'</span></button>';
    });
  }
  dayTitle.textContent = "History";
  view.innerHTML = html;
}

function renderExercise(){
  var name = openExercise;
  var ss = sessionsOf(name);
  var best=0, bestRm=0, totalVol=0;
  ss.forEach(function(s){ s.sets.forEach(function(x){
    if(x.weight>best) best=x.weight;
    if(e1rm(x)>bestRm) bestRm=e1rm(x);
    totalVol += x.reps*x.weight;
  }); });

  var html = '<button class="ghostbtn" id="backHist" style="margin-bottom:14px">‹ All exercises</button>';
  html += '<h2 style="font-family:var(--cond);font-size:27px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 14px">'+esc(name)+'</h2>';
  html += '<div class="prcards">'+
    '<div class="prcard"><div class="cap">Heaviest</div><div class="v">'+trim(best)+' <small>'+db.units+'</small></div></div>'+
    '<div class="prcard"><div class="cap">Est. 1RM</div><div class="v">'+trim(bestRm)+' <small>'+db.units+'</small></div></div>'+
    '<div class="prcard"><div class="cap">Volume</div><div class="v">'+num(totalVol/1000)+'<small>k</small></div></div></div>';

  html += spark(ss);

  ss.slice().reverse().forEach(function(s){
    var v = s.sets.reduce(function(t,x){ return t+x.reps*x.weight; },0);
    html += '<div class="session"><div class="d">'+shortDate(s.date)+' · '+num(v)+' '+db.units+'</div>'+
            '<div class="s">'+esc(summarise(s.sets))+'</div></div>';
  });
  dayTitle.textContent = "History";
  view.innerHTML = html;
}

function spark(ss){
  var pts = ss.slice(-14).map(function(s){ return topSet(s.sets).weight; });
  if(pts.length<2) return '<div class="note">One session so far. The trend line appears after the second.</div>';
  var w=300, h=60, min=Math.min.apply(null,pts), max=Math.max.apply(null,pts);
  var span = (max-min)||1;
  var coords = pts.map(function(v,i){
    return [ (i/(pts.length-1))*w, h - ((v-min)/span)*h ];
  });
  var line = coords.map(function(c,i){ return (i?"L":"M")+c[0].toFixed(1)+" "+c[1].toFixed(1); }).join(" ");
  var area = line+" L"+w+" "+h+" L0 "+h+" Z";
  var dots = coords.map(function(c){ return '<circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="2.6" fill="var(--plate-blue)"/>'; }).join("");
  return '<div class="sparkwrap"><div class="cap">Top set · last '+pts.length+' sessions</div>'+
    '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<path d="'+area+'" fill="rgba(45,125,210,.14)"/>'+
    '<path d="'+line+'" fill="none" stroke="var(--plate-blue)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'+
    dots+'</svg>'+
    '<div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--steel);margin-top:6px">'+
    '<span>'+trim(min)+'</span><span>'+trim(max)+' '+db.units+'</span></div></div>';
}

function renderData(){
  dayTitle.textContent = "Data";
  var days = sortedDays();
  var totalSets = 0;
  days.forEach(function(k){ db.days[k].forEach(function(e){ totalSets += e.sets.length; }); });
  var html = "";
  if(!persistent){
    html += '<div class="note"><b>Saved in this tab only.</b> This copy is running outside its host, so closing the tab clears it. Export a backup file before you leave, and import it next time.</div>';
  }
  html += '<div class="prcards"><div class="prcard"><div class="cap">Days</div><div class="v">'+days.length+'</div></div>'+
          '<div class="prcard"><div class="cap">Sets</div><div class="v">'+totalSets+'</div></div>'+
          '<div class="prcard"><div class="cap">Moves</div><div class="v">'+exerciseNames().length+'</div></div></div>';
  html += '<label class="fl">Weight unit</label>'+
          '<div class="chips"><button class="chip" data-unit="lb"'+(db.units==="lb"?' style="border-color:var(--plate-blue);color:var(--bone)"':'')+'>lb</button>'+
          '<button class="chip" data-unit="kg"'+(db.units==="kg"?' style="border-color:var(--plate-blue);color:var(--bone)"':'')+'>kg</button></div>';
  html += '<div class="toolrow"><button class="ghostbtn" id="exportBtn">Export backup</button>'+
          '<button class="ghostbtn" id="importBtn">Import backup</button></div>';
  html += '<div class="toolrow"><button class="ghostbtn" id="wipeBtn" style="color:var(--plate-red)">Delete everything</button></div>';
  html += '<input type="file" id="fileIn" accept="application/json" class="hide">';
  view.innerHTML = html;
}

function refreshDatalist(){
  document.getElementById("exlist").innerHTML =
    exerciseNames().map(function(n){ return '<option value="'+esc(n)+'">'; }).join("");
}

/* ---------------- entry panel ---------------- */
var draft = null;   // {id, name, sets:[], reps, weight, editing}

function openPanel(entryId){
  var existing = null;
  if(entryId) existing = dayEntries(cursor).filter(function(e){ return e.id===entryId; })[0];
  draft = existing
    ? { id:existing.id, name:existing.name, type:existing.type||"mix", sets:existing.sets.map(function(s){ return {reps:s.reps,weight:s.weight}; }),
        reps:existing.sets[existing.sets.length-1].reps, weight:existing.sets[existing.sets.length-1].weight, editing:true }
    : { id:uid(), name:"", type:(db.lastType||"push"), sets:[], reps:8, weight:(db.units==="lb"?95:40), editing:false };
  paintPanel();
}
function closePanel(){ draft=null; document.getElementById("modal").innerHTML=""; render(); }

function paintPanel(){
  var prev = draft.name ? lastSessionBefore(draft.name, cursor, draft.id) : null;
  var recents = exerciseNamesByType(draft.type).slice(0,8);
  var step = db.units==="lb" ? 5 : 2.5;

  var h = '<div class="panel" role="dialog" aria-label="Log exercise"><div class="panel-head">'+
    '<button class="ghostbtn" id="cancelP">Cancel</button>'+
    '<span class="t">'+(draft.editing?"Edit":"Add")+' exercise</span>'+
    (draft.editing?'<button class="ghostbtn" id="delEntry" style="color:var(--plate-red)">Delete</button>':'')+
    '</div><div class="panel-body">';

  h += '<label class="fl">Workout type</label>'+
       '<div class="chips" style="margin-bottom:16px">'+TYPES.map(function(t){
         return '<button class="chip" data-type="'+t.key+'"'+(draft.type===t.key?' style="border-color:'+typeColor(t.key)+';color:var(--bone)"':'')+'>'+esc(t.label)+'</button>';
       }).join("")+'</div>';

  h += '<label class="fl" for="exName">Exercise</label>'+
       '<input type="text" id="exName" list="exlist" autocapitalize="words" autocomplete="off" '+
       'placeholder="Bench press" value="'+esc(draft.name)+'">';

  if(!draft.name && recents.length){
    h += '<div class="chips">'+recents.map(function(n){
      return '<button class="chip" data-pick="'+esc(n)+'">'+esc(n)+'</button>'; }).join("")+'</div>';
  }

  if(prev){
    h += '<div class="ghostlast"><div class="lbl">Last time · '+shortDate(prev.date)+' · '+daysBetween(prev.date,cursor)+'d ago</div>'+
         '<div class="val">'+esc(summarise(prev.sets))+'</div></div>';
  }

  h += '<div class="steppers">'+
    '<div class="stepper"><div class="cap">Reps</div><div class="row">'+
      '<button class="pm" data-adj="reps:-1" aria-label="Fewer reps">−</button>'+
      '<input type="text" inputmode="numeric" id="repsIn" value="'+draft.reps+'">'+
      '<button class="pm" data-adj="reps:1" aria-label="More reps">+</button></div></div>'+
    '<div class="stepper"><div class="cap">Weight '+db.units+'</div><div class="row">'+
      '<button class="pm" data-adj="weight:-'+step+'" aria-label="Less weight">−</button>'+
      '<input type="text" inputmode="decimal" id="wIn" value="'+trim(draft.weight)+'">'+
      '<button class="pm" data-adj="weight:'+step+'" aria-label="More weight">+</button></div></div></div>';

  h += '<button class="primary" id="logSet" style="margin-top:14px">+ Log set</button>';

  h += '<div class="queued"><div class="qhead"><span>Sets this session</span><span>'+
       (draft.sets.length? num(draft.sets.reduce(function(t,s){return t+s.reps*s.weight;},0))+" "+db.units : "—")+'</span></div>';
  if(!draft.sets.length){
    h += '<div style="padding:18px 2px;color:#5b616b;font-size:13px">No sets yet. Set the numbers above and log your first.</div>';
  }
  draft.sets.forEach(function(s,i){
    var d = "";
    if(prev && prev.sets[i]){
      var dw = s.weight - prev.sets[i].weight, dr = s.reps - prev.sets[i].reps;
      if(dw) d = '<span class="delta'+(dw<0?' down':'')+'">'+(dw>0?"+":"")+trim(dw)+' '+db.units+'</span>';
      else if(dr) d = '<span class="delta'+(dr<0?' down':'')+'">'+(dr>0?"+":"")+dr+' rep'+(Math.abs(dr)>1?"s":"")+'</span>';
      else d = '<span class="delta down">same</span>';
    }
    h += '<div class="qrow"><span class="idx">'+(i+1)+'</span>'+
         '<span class="figure">'+s.reps+'<span class="x">×</span>'+trim(s.weight)+'<span class="unit">'+db.units+'</span></span>'+
         d+'<span class="setvol">'+num(s.reps*s.weight)+'</span>'+
         '<button class="rm" data-rm="'+i+'" aria-label="Remove set '+(i+1)+'">×</button></div>';
  });
  h += '</div></div>';

  h += '<div class="panel-foot"><button class="primary" id="saveEx"'+(draft.sets.length&&draft.name.trim()?"":" disabled")+'>'+
       (draft.editing?"Save changes":"Save to "+labelDate(cursor).toLowerCase())+'</button></div></div>';

  document.getElementById("modal").innerHTML = h;
}

function readInputs(){
  var r = document.getElementById("repsIn"), w = document.getElementById("wIn");
  if(r) draft.reps = Math.max(1, Math.min(999, parseInt(r.value,10)||1));
  if(w) draft.weight = Math.max(0, parseFloat(w.value)||0);
  var n = document.getElementById("exName");
  if(n) draft.name = n.value;
}

/* ---------------- events ---------------- */
document.addEventListener("click", function(ev){
  var t = ev.target.closest("button");
  if(!t) return;

  if(t.id==="prevDay"){ cursor=shiftKey(cursor,-1); render(); return; }
  if(t.id==="nextDay"){ cursor=shiftKey(cursor,1); render(); return; }

  if(t.dataset.tab){
    tab=t.dataset.tab; openExercise=null;
    [].forEach.call(document.querySelectorAll("nav.tabs button"), function(b){
      b.setAttribute("aria-selected", b===t ? "true":"false"); });
    render(); return;
  }

  if(t.id==="addBtn"){ openPanel(null); return; }
  if(t.dataset.edit){ openPanel(t.dataset.edit); return; }
  if(t.dataset.ex){ openExercise=t.dataset.ex; render(); return; }
  if(t.id==="backHist"){ openExercise=null; render(); return; }

  if(t.dataset.unit){ db.units=t.dataset.unit; save(); render(); return; }
  if(t.dataset.htype){ historyType=t.dataset.htype; render(); return; }

  if(t.id==="exportBtn"){
    var blob = new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "reps-backup-"+todayKey()+".json";
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
    return;
  }
  if(t.id==="importBtn"){ document.getElementById("fileIn").click(); return; }
  if(t.id==="wipeBtn"){
    if(confirm("Delete every logged session? This cannot be undone.")){
      db={units:db.units,days:{}}; save(); render();
    }
    return;
  }

  /* panel */
  if(!draft) return;
  if(t.id==="cancelP"){ closePanel(); return; }
  if(t.dataset.type){ readInputs(); draft.type=t.dataset.type; paintPanel(); return; }
  if(t.dataset.pick){ readInputs(); draft.name=t.dataset.pick; prefillFromLast(); paintPanel(); focusName(false); return; }
  if(t.dataset.adj){
    readInputs();
    var p=t.dataset.adj.split(":"), amt=parseFloat(p[1]);
    if(p[0]==="reps") draft.reps=Math.max(1, draft.reps+amt);
    else draft.weight=Math.max(0, Math.round((draft.weight+amt)*100)/100);
    paintPanel(); return;
  }
  if(t.id==="logSet"){
    readInputs();
    if(!draft.name.trim()){ focusName(true); return; }
    draft.sets.push({reps:draft.reps, weight:draft.weight});
    paintPanel(); return;
  }
  if(t.dataset.rm!==undefined && t.classList.contains("rm")){
    readInputs(); draft.sets.splice(+t.dataset.rm,1); paintPanel(); return;
  }
  if(t.id==="delEntry"){
    db.days[cursor] = dayEntries(cursor).filter(function(e){ return e.id!==draft.id; });
    save(); closePanel(); return;
  }
  if(t.id==="saveEx"){
    readInputs();
    if(!draft.name.trim() || !draft.sets.length) return;
    var list = db.days[cursor] || (db.days[cursor]=[]);
    var idx = -1;
    list.forEach(function(e,i){ if(e.id===draft.id) idx=i; });
    var rec = { id:draft.id, name:draft.name.trim(), type:draft.type||"mix", sets:draft.sets };
    if(idx>=0) list[idx]=rec; else list.push(rec);
    db.lastType = rec.type;
    save(); closePanel(); return;
  }
});

function focusName(select){
  var n=document.getElementById("exName");
  if(n){ n.focus(); if(select) n.select(); }
}
function prefillFromLast(){
  var prev = lastSessionBefore(draft.name, cursor, draft.id);
  if(prev && prev.sets.length && !draft.sets.length){
    draft.reps = prev.sets[0].reps;
    draft.weight = prev.sets[0].weight;
  }
}

document.addEventListener("change", function(ev){
  if(ev.target.id==="exName" && draft){
    draft.name = ev.target.value;
    prefillFromLast();
    paintPanel();
  }
  if(ev.target.id==="fileIn" && ev.target.files[0]){
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var d=JSON.parse(fr.result);
        if(!d || typeof d.days!=="object") throw 0;
        db={units:d.units||"lb", days:d.days};
        save(); render();
      }catch(e){ alert("That file isn't a Reps backup. Pick the .json you exported."); }
    };
    fr.readAsText(ev.target.files[0]);
  }
});

document.addEventListener("input", function(ev){
  if(ev.target.id==="q"){
    window.__q = ev.target.value;
    var q = window.__q.toLowerCase();
    [].forEach.call(document.querySelectorAll(".hrow"), function(r){
      r.classList.toggle("hide", r.dataset.ex.toLowerCase().indexOf(q) < 0);
    });
  }
});

document.addEventListener("keydown", function(ev){
  if(ev.key==="Enter" && draft){
    if(ev.target.id==="repsIn" || ev.target.id==="wIn"){
      ev.preventDefault(); ev.target.blur();
      readInputs(); draft.sets.push({reps:draft.reps, weight:draft.weight}); paintPanel();
    }
    if(ev.target.id==="exName"){ ev.preventDefault(); ev.target.blur(); }
  }
});

/* ---------------- boot ---------------- */
store.get(KEY).then(function(raw){
  if(raw){ try{ var d=JSON.parse(raw); if(d && d.days) db=d; }catch(e){} }
  render();
});

})();
</script>
</body>
</html>
